_BASE_: [
  'rtdetrv3_r18vd_visdrone_p2_output_aux.yml',
]

weights: output/rtdetrv3_r18vd_visdrone_p2_output_aux_ignore/model_final
save_dir: output/rtdetrv3_r18vd_visdrone_p2_output_aux_ignore
output_eval: output/rtdetrv3_r18vd_visdrone_p2_output_aux_ignore/eval

RTDETRV3:
  small_object_aux_head: PPYOLOESmallObjectIgnoreHead

PPYOLOESmallObjectIgnoreHead:
  fpn_strides: [8]
  grid_cell_scale: 5.0
  grid_cell_offset: 0.5
  static_assigner_epoch: 1
  use_varifocal_loss: True
  loss_weight: {class: 1.0, iou: 2.5, dfl: 0.5}
  static_assigner:
    name: ATSSAssigner
    topk: 9
  assigner:
    name: TaskAlignedAssigner
    topk: 13
    alpha: 1.0
    beta: 6.0
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.01
    nms_threshold: 0.7
